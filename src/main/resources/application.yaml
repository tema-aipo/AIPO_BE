spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aipo
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

external:
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr/api
    sync:
      enabled: ${OPENDART_SYNC_ENABLED:true}
      collection-months: ${OPENDART_SYNC_COLLECTION_MONTHS:3}
      cron: ${OPENDART_SYNC_CRON:0 0 3 * * *}
      zone: Asia/Seoul
  kind:
    base-url: https://kind.krx.co.kr
