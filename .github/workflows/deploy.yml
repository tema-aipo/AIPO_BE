name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use preinstalled JDK 21
        run: |
          set -e
          if [ -n "${JAVA_HOME_21_X64:-}" ]; then
            echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          else
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk
            echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
            echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"
          fi
          java -version

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Check build output
        run: |
          set -e
          echo "Current directory"
          pwd

          echo "Gradle build output"
          ls -al build/libs

          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*plain.jar" | head -n 1)"
          if [ -z "$JAR_FILE" ]; then
            echo "No executable Spring Boot jar found in build/libs"
            exit 1
          fi

          mkdir -p deploy
          cp "$JAR_FILE" deploy/app.jar

          echo "Deploy artifact"
          ls -al deploy

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/aipo_ec2_key
          chmod 600 ~/.ssh/aipo_ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Prepare EC2 deploy directory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/aipo_ec2_key "$EC2_USER@$EC2_HOST" 'rm -rf /tmp/aipo-deploy && mkdir -p /tmp/aipo-deploy && ls -al /tmp/aipo-deploy'

      - name: Upload jar to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          scp -i ~/.ssh/aipo_ec2_key deploy/app.jar "$EC2_USER@$EC2_HOST:/tmp/aipo-deploy/app.jar"

      - name: Restart Spring Boot service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -e
          ssh -i ~/.ssh/aipo_ec2_key "$EC2_USER@$EC2_HOST" <<'EOF'
          set -e
          APP_DIR="/opt/aipo"
          APP_JAR="$APP_DIR/app.jar"
          APP_JAR_PATTERN="[/]opt/aipo/app.jar"

          echo "Check uploaded jar"
          ls -al /tmp/aipo-deploy
          if [ ! -f /tmp/aipo-deploy/app.jar ]; then
            echo "Uploaded jar not found: /tmp/aipo-deploy/app.jar"
            exit 1
          fi

          echo "Check app directory"
          sudo mkdir -p "$APP_DIR"
          sudo ls -al "$APP_DIR" || true

          echo "Current service status"
          sudo systemctl status aipo --no-pager || true

          echo "Stop service"
          sudo systemctl stop aipo || true

          echo "Kill duplicated java process"
          sudo pkill -f "$APP_JAR_PATTERN" || true
          sleep 5

          echo "Reload systemd"
          sudo systemctl daemon-reload

          echo "Replace app.jar"
          sudo install -m 0644 /tmp/aipo-deploy/app.jar "$APP_JAR"
          sudo ls -al "$APP_DIR"

          echo "Start service"
          sudo systemctl start aipo

          echo "Check service status"
          sudo systemctl status aipo --no-pager

          echo "Recent service logs"
          sudo journalctl -u aipo --since "2 minutes ago" --no-pager || true
          EOF
