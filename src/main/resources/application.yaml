spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/aipo
    username: postgres
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/init

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000


upload:
  dir: ${UPLOAD_DIR:./uploads}

ipo:
  crawler:
    dart-api-key: ${DART_API_KEY:}
    # 평일 오전 8시 KST (cron: 초 분 시 일 월 요일)
    cron: "0 0 8 * * MON-FRI"
    # 크롤링 기준: 오늘부터 며칠 전까지 공시를 조회할지 (기본 1일)
    lookback-days: 1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
