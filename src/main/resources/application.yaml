spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aipo}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:aipo-jwt-secret-key-local-dev-2024}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000


springdoc:
  swagger-ui:
    path: /swagger-ui.html

upload:
  dir: ${UPLOAD_DIR:./uploads}

ipo:
  crawler:
    dart-api-key: ${DART_API_KEY:}
    cron: "0 0 8 * * MON-FRI"
    lookback-days: 1

external:
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr/api
    sync:
      enabled: ${OPENDART_SYNC_ENABLED:true}
      collection-months: ${OPENDART_SYNC_COLLECTION_MONTHS:3}
      cron: ${OPENDART_SYNC_CRON:0 0 3 * * *}
      zone: Asia/Seoul
  kind:
    base-url: https://kind.krx.co.kr

chatbot:
  base-url: ${CHATBOT_BASE_URL:http://localhost:8000}
  timeout-seconds: ${CHATBOT_TIMEOUT_SECONDS:30}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:5173
      - http://localhost:8080
      - http://127.0.0.1:5500
      - http://3.37.25.92:8080
      - http://gachon-25-s3-459600194430-ap-northeast-2-an.s3-website.ap-northeast-2.amazonaws.com
      - https://main.dmkb1ghrc591f.amplifyapp.com
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      - https://*.amplifyapp.com
