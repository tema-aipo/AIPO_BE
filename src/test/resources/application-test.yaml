spring:
  datasource:
    url: jdbc:h2:mem:aipo-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

jwt:
  secret: 1234567890123456789012345678901234567890123456789012345678901234
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000
