name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Check build output
        run: |
          set -e
          echo "Current directory"
          pwd

          echo "Gradle build output"
          ls -al build/libs

          JAR_FILE="$(find build/libs -maxdepth 1 -type f -name "*.jar" ! -name "*plain.jar" | head -n 1)"
          if [ -z "$JAR_FILE" ]; then
            echo "No executable Spring Boot jar found in build/libs"
            exit 1
          fi

          mkdir -p deploy
          cp "$JAR_FILE" deploy/app.jar

          echo "Deploy artifact"
          ls -al deploy

      - name: Prepare EC2 deploy directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Prepare deploy directory"
            rm -rf /tmp/aipo-deploy
            mkdir -p /tmp/aipo-deploy
            ls -al /tmp/aipo-deploy

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/app.jar"
          target: "/tmp/aipo-deploy"
          strip_components: 1

      - name: Restart Spring Boot service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Check uploaded jar"
            ls -al /tmp/aipo-deploy
            if [ ! -f /tmp/aipo-deploy/app.jar ]; then
              echo "Uploaded jar not found: /tmp/aipo-deploy/app.jar"
              exit 1
            fi

            echo "Check app directory"
            sudo mkdir -p /opt/aipo
            sudo ls -al /opt/aipo || true

            echo "Current service status"
            sudo systemctl status aipo --no-pager || true

            echo "Stop service"
            sudo systemctl stop aipo || true

            echo "Kill duplicated java process"
            sudo pkill -f "[/]opt/aipo/app.jar" || true
            sleep 5

            echo "Reload systemd"
            sudo systemctl daemon-reload

            echo "Replace app.jar"
            sudo install -m 0644 /tmp/aipo-deploy/app.jar /opt/aipo/app.jar
            sudo ls -al /opt/aipo

            echo "Start service"
            sudo systemctl start aipo

            echo "Check service status"
            sudo systemctl status aipo --no-pager

            echo "Recent service logs"
            sudo journalctl -u aipo --since "2 minutes ago" --no-pager || true
