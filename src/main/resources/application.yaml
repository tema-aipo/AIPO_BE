spring:
  datasource:
    # AWS RDS 주소로 직접 고정했습니다!
    url: jdbc:mysql://gachon-25-db.cjysow2c4blk.ap-northeast-2.rds.amazonaws.com:3306/aipo_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: admin
    password: root1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

  jpa:
    hibernate:
      # ✨ 아주 안전한 설정! 서버를 껐다 켜도 데이터가 날아가지 않습니다.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:aipo-jwt-secret-key-local-dev-2024}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

upload:
  dir: ${UPLOAD_DIR:./uploads}

ipo:
  crawler:
    dart-api-key: ${DART_API_KEY:}
    cron: "0 0 8 * * MON-FRI"
    lookback-days: 1

external:
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr/api
    sync:
      enabled: ${OPENDART_SYNC_ENABLED:true}
      collection-months: ${OPENDART_SYNC_COLLECTION_MONTHS:3}
      cron: ${OPENDART_SYNC_CRON:0 0 3 * * *}
      zone: Asia/Seoul
  kind:
    base-url: https://kind.krx.co.kr

chatbot:
  base-url: ${CHATBOT_BASE_URL:http://localhost:8000}
  timeout-seconds: ${CHATBOT_TIMEOUT_SECONDS:30}

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://localhost:*,http://127.0.0.1:*}}