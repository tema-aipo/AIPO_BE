name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
      # 필요하면 아래 브랜치도 추가
      # - codex/aipo_backend
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build jar
        run: ./gradlew clean bootJar

      - name: Upload jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "build/libs/*.jar"
          target: "/tmp/aipo-deploy"
          strip_components: 2

      - name: Restart Spring Boot service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Check uploaded jar"
            ls -al /tmp/aipo-deploy

            echo "Stop service"
            sudo systemctl stop aipo-backend

            echo "Replace app.jar"
            cp /tmp/aipo-deploy/*.jar /opt/aipo/app.jar

            echo "Start service"
            sudo systemctl start aipo-backend

            echo "Check service status"
            sudo systemctl status aipo-backend --no-pager