spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET:aipo-jwt-secret-key-local-dev-2024}
  access-token-expiration: 3600000
  refresh-token-expiration: 604800000


springdoc:
  swagger-ui:
    path: /swagger-ui.html

upload:
  dir: ${UPLOAD_DIR:./uploads}

ipo:
  crawler:
    dart-api-key: ${DART_API_KEY:}
    cron: "0 0 8 * * MON-FRI"
    lookback-days: 1

external:
  opendart:
    api-key: ${OPENDART_API_KEY:}
    base-url: https://opendart.fss.or.kr/api
    sync:
      enabled: ${OPENDART_SYNC_ENABLED:true}
      collection-months: ${OPENDART_SYNC_COLLECTION_MONTHS:3}
      cron: ${OPENDART_SYNC_CRON:0 0 3 * * *}
      zone: Asia/Seoul
  kind:
    base-url: https://kind.krx.co.kr
